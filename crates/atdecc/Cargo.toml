[package]
name = "atdecc"
description = "IEEE 1722.1 ATDECC (AVDECC) with Milan: frames, controller and entity state machines, without I/O"
version = "0.1.0"
categories = ["network-programming", "multimedia::audio", "no-std"]
keywords = ["atdecc", "avdecc", "avb", "milan", "1722"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# The controller and entity state machines, which keep tables. The codecs
# need neither this nor std.
alloc = []
# Raw Ethernet on Linux, macOS and Windows through avb-net, and a blocking
# driver for apps that do not bring their own loop, which on macOS reaches
# the Mac's own entities through the AudioVideoBridging framework.
std = ["alloc", "avb-net/std", "dep:objc2", "dep:block2", "dep:objc2-foundation"]

[dependencies]
avb-mrp.workspace = true
avb-net.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
