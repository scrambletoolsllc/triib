[package]
name = "triib"
description = "Lightweight ATDECC and Milan controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
iced = { version = "0.14", features = ["advanced", "canvas"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
scramble-ui.workspace = true
atdecc = { workspace = true, features = ["std"] }
avb-mrp.workspace = true
avb-net = { workspace = true, features = ["std"] }
triib-store.workspace = true
triib-endpointd.workspace = true
triib-stream.workspace = true
i18n-embed = { version = "0.16", features = ["desktop-requester", "fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
# Outside control: the control channel, and `triib --mcp` for AI agents.
interprocess = "2"
serde_json = "1"
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt", "sync"] }
schemars = "1"

# The folder dialogs Settings opens: the XDG desktop portal on Linux, the
# system's own dialogs elsewhere, as prev has them.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "file_chooser"] }
# The portal's helper drops triib's capabilities.
libc = "0.2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.15", default-features = false }

# The Core Audio device macOS makes of the Mac's own AVB entity.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }

[target.'cfg(windows)'.dependencies]
# `triib --mcp` keeps its pipes from the triib it starts.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
iced_test = "0.14"
