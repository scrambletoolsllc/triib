[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.5.6"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrambletoolsllc/triib"

[workspace.dependencies]
# The AVB crates, shared with other apps, from crates.io. A git-ignored
# .cargo/avb-local.toml can point them at a local checkout while changing
# both (see the README).
atdecc = { version = "0.2.4", default-features = false }
avb-mrp = { version = "0.1.4", default-features = false }
avb-net = { version = "0.1.6", default-features = false }
avb-stream = "0.4.0"
gptp = "0.3"
# This computer's entities run in avb-endpointd, shared with plaa: its
# files, status and meters, from crates.io.
avb-endpointd = "0.3.6"
triib-store = { path = "crates/triib-store", version = "1.5.6" }
triib-firmware = { path = "crates/triib-firmware", version = "1.5.6" }
triib-devicelog = { path = "crates/triib-devicelog", version = "1.5.6" }
# Pinned by revision, as prev pins it. A git-ignored .cargo/config.toml can
# point it at a local checkout while changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "44f04645e9593abe4ed12bc7c4fac463d9abe03b", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "44f04645e9593abe4ed12bc7c4fac463d9abe03b" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "44f04645e9593abe4ed12bc7c4fac463d9abe03b" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "44f04645e9593abe4ed12bc7c4fac463d9abe03b" }
