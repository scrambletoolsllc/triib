[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrambletools/triib"

[workspace.dependencies]
# Protocol crates, usable outside triib: no dependencies beyond avb-net, and
# without std when its default feature is off.
atdecc = { path = "crates/atdecc", version = "0.1.0", default-features = false }
avb-mrp = { path = "crates/avb-mrp", version = "0.1.0", default-features = false }
avb-net = { path = "crates/avb-net", version = "0.1.0", default-features = false }
triib-store = { path = "crates/triib-store", version = "0.9.0" }
triib-stream = { path = "crates/triib-stream", version = "0.9.0" }
triib-pipewire = { path = "crates/triib-pipewire", version = "0.9.0" }
triib-endpointd = { path = "crates/triib-endpointd", version = "0.9.0" }
# Pinned by revision, as prev pins it. A git-ignored .cargo/config.toml can
# point it at a local checkout while changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "e78c85e00e00c9e2ea5ad046f64a559531fae1f5", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "e78c85e00e00c9e2ea5ad046f64a559531fae1f5" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "e78c85e00e00c9e2ea5ad046f64a559531fae1f5" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "e78c85e00e00c9e2ea5ad046f64a559531fae1f5" }
