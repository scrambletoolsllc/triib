[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrambletoolsllc/triib"

[workspace.dependencies]
# The AVB crates, shared with other apps, from crates.io. A git-ignored
# .cargo/avb-local.toml can point them at a local checkout while changing
# both (see the README).
atdecc = { version = "0.1.3", default-features = false }
avb-mrp = { version = "0.1.1", default-features = false }
avb-net = { version = "0.1.0", default-features = false }
avb-stream = "0.1.1"
triib-store = { path = "crates/triib-store", version = "1.2.0" }
triib-pipewire = { path = "crates/triib-pipewire", version = "1.2.0" }
triib-endpointd = { path = "crates/triib-endpointd", version = "1.2.0" }
# Pinned by revision, as prev pins it. A git-ignored .cargo/config.toml can
# point it at a local checkout while changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "891f44c6a70553c6a6ac094fab25e1b6945b95d0" }
