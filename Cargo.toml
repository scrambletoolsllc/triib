[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scrambletoolsllc/triib"

[workspace.dependencies]
# The AVB crates, shared with other apps, pinned by revision. A git-ignored
# .cargo/config.toml can point them at a local checkout while changing both
# (see the README).
atdecc = { git = "https://github.com/scrambletools/avb", rev = "130a43de6d83596601aa1b0e4e7156e675bf5b15", version = "0.1.0", default-features = false }
avb-mrp = { git = "https://github.com/scrambletools/avb", rev = "130a43de6d83596601aa1b0e4e7156e675bf5b15", version = "0.1.0", default-features = false }
avb-net = { git = "https://github.com/scrambletools/avb", rev = "130a43de6d83596601aa1b0e4e7156e675bf5b15", version = "0.1.0", default-features = false }
avb-stream = { git = "https://github.com/scrambletools/avb", rev = "130a43de6d83596601aa1b0e4e7156e675bf5b15", version = "0.1.0" }
triib-store = { path = "crates/triib-store", version = "1.1.1" }
triib-pipewire = { path = "crates/triib-pipewire", version = "1.1.1" }
triib-endpointd = { path = "crates/triib-endpointd", version = "1.1.1" }
# Pinned by revision, as prev pins it. A git-ignored .cargo/config.toml can
# point it at a local checkout while changing both (see the README).
scramble-ui = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Right to left text in text inputs and the keyboard layout in use; the
# copies live with scramble-ui, see its vendor/PATCHES.md.
[patch.crates-io]
iced_graphics = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b" }
iced_widget = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b" }
winit = { git = "https://github.com/scrambletools/scramble-ui", rev = "1b57adae70aab7efc4e57d1a777d295acc45b46b" }
