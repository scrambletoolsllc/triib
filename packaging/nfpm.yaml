# Debian and RPM packages, made with nfpm (https://nfpm.goreleaser.com)
# from a tree staged by triib's scripts/dist-install.sh and, from builds
# of their releases' tags, avb-endpointd's and gptpd's:
#
#   scripts/dist-install.sh target/release stage /usr
#   endpointd/scripts/dist-install.sh endpointd/target/release stage /usr
#   gptp/scripts/dist-install.sh gptp/target/release stage /usr
#   VERSION=1.5.6 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
#   VERSION=1.5.6 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm
#
# avb-endpointd, which runs host entities, and gptpd, which keeps their
# network's time, go in this package, as no distribution has them, so
# installing it is all host entities take. It replaces gptpd's own
# package, which older releases came with. Installing grants avb-netraw
# CAP_NET_RAW, makes the gptpd group, and says what it changes on the
# system and why (packaging/linux). ethtool and iproute2's ip and tc run
# avb-link@, and RealtimeKit gives host entities' stream threads realtime
# priority.
name: triib
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: sound
priority: optional
maintainer: Scramble Tools <https://github.com/scrambletools>
vendor: Scramble Tools
homepage: https://github.com/scrambletoolsllc/triib
license: MIT OR Apache-2.0
description: |-
  Discover, connect and set up AVB and Milan devices
  triib is a lightweight ATDECC (IEEE 1722.1) controller with Milan and
  AVB Lite support: a connection matrix, the network as gPTP shows it,
  device settings, presets and a frame log, with triib-cli for the
  command line, and avb-endpointd and gptpd for talkers and listeners
  on this computer.

provides:
  - avb-endpointd
  - gptpd
conflicts:
  - avb-endpointd
  - gptpd
# Replaces in a .deb, Obsoletes in an .rpm: apt and dnf take gptpd's own
# package out for this one, rather than refusing.
replaces:
  - gptpd

contents:
  - src: ./stage/usr/
    dst: /usr
    type: tree
  - dst: /etc/gptpd
    type: dir
    file_info:
      mode: 0755

scripts:
  preinstall: ./packaging/linux/preinstall.sh
  postinstall: ./packaging/linux/postinstall.sh
  postremove: ./packaging/linux/postremove.sh

overrides:
  deb:
    depends:
      - libasound2
      - libpipewire-0.3-0
      - libc6 (>= 2.39)
      - libgcc-s1
      - libcap2-bin
      - libwayland-client0
      - libxkbcommon0
      - libvulkan1
      - ethtool
      - iproute2
      - rtkit
    recommends:
      - mesa-vulkan-drivers
      - polkitd | policykit-1
  rpm:
    depends:
      - alsa-lib
      - glibc >= 2.39
      - pipewire-libs
      - libcap
      - libwayland-client
      - libxkbcommon
      - vulkan-loader
      - ethtool
      - iproute
      # Fedora's tc comes in a package of its own.
      - iproute-tc
      - rtkit
    recommends:
      - mesa-vulkan-drivers
      - polkit

rpm:
  group: Applications/Multimedia
  summary: Discover, connect and set up AVB and Milan devices
