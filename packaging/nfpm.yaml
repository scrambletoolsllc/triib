# Debian and RPM packages, made with nfpm (https://nfpm.goreleaser.com)
# from a tree staged by triib's scripts/dist-install.sh and, from a build
# of the avb crates' release, avb's:
#
#   scripts/dist-install.sh target/release stage /usr
#   ../avb/scripts/dist-install.sh ../avb/target/release stage /usr
#   VERSION=1.3.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb
#   VERSION=1.3.0 ARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm
#
# avb-endpointd, which runs host entities, goes in this package until it
# has its own, which replaces it. Installing grants avb-netraw
# CAP_NET_RAW and says what it changes on the system and why
# (packaging/linux). ethtool and iproute2's ip and tc run avb-link@, and
# RealtimeKit gives host entities' stream threads realtime priority.
name: triib
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: sound
priority: optional
maintainer: Scramble Tools <https://github.com/scrambletools>
vendor: Scramble Tools
homepage: https://github.com/scrambletoolsllc/triib
license: MIT OR Apache-2.0
description: |-
  Discover, connect and set up AVB and Milan devices
  triib is a lightweight ATDECC (IEEE 1722.1) controller with Milan and
  AVB Lite support: a connection matrix, the network as gPTP shows it,
  device settings, presets and a frame log, with triib-cli for the
  command line and avb-endpointd for talkers and listeners on this
  computer.

provides:
  - avb-endpointd
conflicts:
  - avb-endpointd

contents:
  - src: ./stage/usr/
    dst: /usr
    type: tree

scripts:
  preinstall: ./packaging/linux/preinstall.sh
  postinstall: ./packaging/linux/postinstall.sh
  postremove: ./packaging/linux/postremove.sh

overrides:
  deb:
    depends:
      - libasound2
      - libpipewire-0.3-0
      - libc6 (>= 2.39)
      - libgcc-s1
      - libcap2-bin
      - libwayland-client0
      - libxkbcommon0
      - libvulkan1
      - ethtool
      - iproute2
      - rtkit
    recommends:
      - mesa-vulkan-drivers
      - gptpd
  rpm:
    depends:
      - alsa-lib
      - glibc >= 2.39
      - pipewire-libs
      - libcap
      - libwayland-client
      - libxkbcommon
      - vulkan-loader
      - ethtool
      - iproute
      - rtkit
    recommends:
      - mesa-vulkan-drivers
      - gptpd

rpm:
  group: Applications/Multimedia
  summary: Discover, connect and set up AVB and Milan devices
